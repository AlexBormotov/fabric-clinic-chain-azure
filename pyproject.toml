[project]
name = "clinic-chain"
version = "0.1.0"
description = "Clinic chain analytics and real-time bed monitoring on Microsoft Fabric"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
    "sqlfluff==4.4.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: runs Synthea; minutes long (make test-slow)"]

[tool.ruff]
line-length = 100
target-version = "py313"
# Vendored from the AI Factory kit; kept byte-identical to upstream.
extend-exclude = [".claude", ".agents"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
