[project]
name = "clinic-chain"
version = "0.1.0"
description = "Clinic chain analytics and real-time bed monitoring on Microsoft Fabric"
requires-python = ">=3.13,<3.14"
dependencies = [
    "azure-eventhub==5.15.1",
    "azure-kusto-data==6.0.4",
    "azure-storage-blob==12.31.0",
    "delta-spark==4.2.0",
    "fabric-cicd==1.4.0",
    "mssql-python==1.16.0",
    "openpyxl==3.1.5",
    "pandas==3.0.6",
    "pyarrow==25.0.1",
    "pyspark==4.1.1",
    "pyyaml==6.0.3",
    "soda-core==4.29.0",
    "soda-sparkdf==4.29.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
    "sqlfluff==4.4.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
addopts = "-m 'not slow and not stand and not kusto'"
markers = [
    "slow: runs Synthea; minutes long (make test-slow)",
    "stand: reads the local source stand; needs `make up` (make test-stand)",
    "kusto: runs KQL on the Kusto emulator (make kql-test)",
]

[tool.ruff]
line-length = 100
target-version = "py313"
# Vendored from the AI Factory kit; kept byte-identical to upstream.
extend-exclude = [".claude", ".agents"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Fabric notebooks: cells import where they start, after the parameters cell.
"fabric/**/notebook-content.py" = ["E402"]
