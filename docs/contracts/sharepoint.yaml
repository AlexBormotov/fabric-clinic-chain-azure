system: sharepoint
tables:
  beds:
    file: sharepoint/beds.xlsx#beds
    primary_key: [bed_id]
    columns:
      - {name: clinic_id, type: string}
      - {name: clinic_name, type: string}
      - {name: ward_id, type: string}
      - {name: ward_name, type: string}
      - {name: bed_id, type: string}
  staff:
    file: sharepoint/rosters.xlsx#staff
    primary_key: [staff_id]
    columns:
      - {name: staff_id, type: string}
      - {name: clinic_id, type: string}
      - {name: role, type: string}
      - {name: ward_id, type: string}
      - {name: given_name, type: string}
      - {name: family_name, type: string}
      - {name: npi, type: string, nullable: true}
  roster:
    file: sharepoint/rosters.xlsx#roster
    primary_key: [staff_id, week_start]
    columns:
      - {name: staff_id, type: string}
      - {name: week_start, type: date}
      - {name: ward_id, type: string}
      - {name: shift, type: string}
      - {name: shifts_planned, type: int}
