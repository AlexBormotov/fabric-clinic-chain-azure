services:
  dev:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    image: clinic-chain-dev:local
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD-}
      ADT_EVENTHUB_CONNECTION_STRING: ${ADT_EVENTHUB_CONNECTION_STRING-}
    volumes:
      - .:/workspace
      - uv-cache:/root/.cache/uv
      - venv:/opt/venv
      - ivy-cache:/root/.ivy2.5.2

  # Local source stand (`make up`): billing source on SQL Server, raw files on the Blob emulator.
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD-}
    mem_limit: 2g
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck --loose
    healthcheck:
      test: nc -z 127.0.0.1 10000
      interval: 2s
      timeout: 2s
      retries: 30

  # ADT stream stand-in for Eventstream (U11). The image has no shell; `make up` polls :5300/health.
  eventhubs:
    image: mcr.microsoft.com/azure-messaging/eventhubs-emulator:2.2.1
    environment:
      ACCEPT_EULA: "Y"
      BLOB_SERVER: eventhubs-azurite
      METADATA_SERVER: eventhubs-azurite
    volumes:
      - ./config/eventhubs.json:/Eventhubs_Emulator/ConfigFiles/Config.json:ro
    depends_on:
      eventhubs-azurite:
        condition: service_healthy

  # The emulator's own storage (blob and table), kept apart from the source stand's Azurite.
  eventhubs-azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck --loose
    healthcheck:
      test: nc -z 127.0.0.1 10002
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  uv-cache:
  venv:
  ivy-cache:
