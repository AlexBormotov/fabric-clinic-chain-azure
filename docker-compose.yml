services:
  dev:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    image: clinic-chain-dev:local
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD-}
      # make deploy / make republish (U19): identity, target and parameter.yml values.
      ACTIONS_ID_TOKEN_REQUEST_URL: ${ACTIONS_ID_TOKEN_REQUEST_URL-}
      ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN-}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID-}
      FABRIC_WORKSPACE_ID: ${FABRIC_WORKSPACE_ID-}
      FABRIC_SQL_CONNECTION_ID: ${FABRIC_SQL_CONNECTION_ID-}
      FABRIC_BLOB_CONNECTION_ID: ${FABRIC_BLOB_CONNECTION_ID-}
      SHAREPOINT_SITE_URL: ${SHAREPOINT_SITE_URL-}
    volumes:
      - .:/workspace
      - uv-cache:/root/.cache/uv
      - venv:/opt/venv
      - ivy-cache:/root/.ivy2.5.2

  # Local source stand (`make up`): billing source on SQL Server, raw files on the Blob emulator.
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD-}
    mem_limit: 2g
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck --loose
    healthcheck:
      test: nc -z 127.0.0.1 10000
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  uv-cache:
  venv:
  ivy-cache:
